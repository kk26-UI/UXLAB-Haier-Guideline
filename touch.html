<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haier Design | 触摸</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--brand-primary:#2283E2;--brand-light:#E5F0FF}*{box-sizing:border-box}body{font-family:Inter,-apple-system,sans-serif;background:#F5F7FA;color:#1D1D1F}.aura-background{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% 10%,#C4E0FF,transparent 42%),radial-gradient(circle at 90% 90%,#E0E8FF,transparent 45%),#F4F7FB}.glass-panel{background:rgba(255,255,255,.66);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.65);box-shadow:0 8px 32px rgba(0,0,0,.04);border-radius:24px}.sidebar-nav-item{transition:.3s;border-left:3px solid transparent}.sidebar-nav-item.active{color:var(--brand-primary);font-weight:600;border-left-color:var(--brand-primary);background:linear-gradient(90deg,var(--brand-light),transparent)}.haier-logo-container{display:flex;align-items:center;justify-content:center;background:#2283E2;color:white;font:bold 14px Arial;border-radius:8px}.demo{height:180px;border-radius:18px;background:#111827;display:grid;place-items:center}.touch-target{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;color:white;background:#2283E2;box-shadow:0 0 0 16px rgba(34,131,226,.12);animation:press 2s ease-in-out infinite}@keyframes press{0%,100%{transform:scale(1)}50%{transform:scale(.92);box-shadow:0 0 0 6px rgba(34,131,226,.22)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><div class="aura-background"></div><header class="md:hidden glass-panel rounded-none fixed top-0 w-full z-50 p-4 flex justify-between"><b>Haier Design</b><button id="mobile-menu-btn">☰</button></header><div class="flex h-screen pt-16 md:pt-0"><aside id="sidebar" class="hidden md:flex flex-col w-72 h-full fixed glass-panel rounded-none z-40 overflow-y-auto" aria-hidden="true"></aside><div id="sidebar-backdrop" class="fixed inset-0 bg-black/20 z-30 hidden"></div><main id="main-content" class="flex-1 md:ml-72 p-6 md:p-12 lg:p-20 overflow-y-auto"><div class="max-w-5xl"><p class="text-xs font-bold tracking-[.18em] text-blue-600 uppercase mb-3">Sensory · Touch</p><h1 class="text-4xl font-bold mb-3">触摸反馈</h1><p class="text-gray-500 leading-7 mb-9">定义触控热区、按压状态和触觉反馈，使屏幕交互与实体操作保持一致。</p><section class="glass-panel p-8"><h2 class="text-xl font-bold mb-2">触控响应</h2><p class="text-sm text-gray-500 mb-6">触摸发生时，视觉状态应立即响应；触觉反馈紧随其后，避免延迟造成不确定感。</p><div class="demo"><div class="touch-target">按压</div></div></section><div class="grid md:grid-cols-3 gap-5 mt-6"><article class="glass-panel p-6"><b>热区</b><p class="text-sm text-gray-500 mt-3">最小触控区域 44 × 44 px，并根据真实硬件尺寸调整。</p></article><article class="glass-panel p-6"><b>按压</b><p class="text-sm text-gray-500 mt-3">视觉缩放控制在 92%–96%，持续 80–120ms。</p></article><article class="glass-panel p-6"><b>反馈</b><p class="text-sm text-gray-500 mt-3">关键操作提供清晰但克制的 Tick / Pop 触觉反馈。</p></article></div></div><footer class="pt-10 pb-16 text-center text-gray-400 text-sm"><p class="font-light">&copy; 2026 Haier Design Lab. Internal Confidential.</p></footer></main></div><script src="haier-nav.js"></script></body></html>
