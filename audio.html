<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haier Design | 音效</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--brand-primary:#2283E2;--brand-light:#E5F0FF}*{box-sizing:border-box}body{font-family:Inter,-apple-system,sans-serif;background:#F5F7FA;color:#1D1D1F}.aura-background{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% 10%,#C4E0FF,transparent 42%),radial-gradient(circle at 90% 90%,#E0E8FF,transparent 45%),#F4F7FB}.glass-panel{background:rgba(255,255,255,.66);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.65);box-shadow:0 8px 32px rgba(0,0,0,.04);border-radius:24px}.sidebar-nav-item{transition:.3s;border-left:3px solid transparent}.sidebar-nav-item.active{color:var(--brand-primary);font-weight:600;border-left-color:var(--brand-primary);background:linear-gradient(90deg,var(--brand-light),transparent)}.wave{height:180px;border-radius:18px;background:#08101B;display:flex;align-items:center;justify-content:center;gap:7px}.wave i{width:5px;height:22px;border-radius:8px;background:#168AFF;box-shadow:0 0 10px #168AFF;animation:wave 1.1s ease-in-out infinite}.wave i:nth-child(2),.wave i:nth-child(6){animation-delay:-.15s}.wave i:nth-child(3),.wave i:nth-child(5){animation-delay:-.3s}.wave i:nth-child(4){animation-delay:-.45s}@keyframes wave{0%,100%{height:18px;opacity:.4}50%{height:76px;opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><div class="aura-background"></div><header class="md:hidden glass-panel rounded-none fixed top-0 w-full z-50 p-4 flex justify-between"><b>Haier Design</b><button id="mobile-menu-btn">☰</button></header><div class="flex h-screen pt-16 md:pt-0"><aside id="sidebar" class="hidden md:flex flex-col w-72 h-full fixed glass-panel rounded-none z-40 overflow-y-auto" aria-hidden="true"></aside><div id="sidebar-backdrop" class="fixed inset-0 bg-black/20 z-30 hidden"></div><main id="main-content" class="flex-1 md:ml-72 p-6 md:p-12 lg:p-20 overflow-y-auto"><div class="max-w-5xl"><p class="text-xs font-bold tracking-[.18em] text-blue-600 uppercase mb-3">Sensory · Audio</p><h1 class="text-4xl font-bold mb-3">音效反馈</h1><p class="text-gray-500 leading-7 mb-9">以柔和、克制且可识别的声音表达操作、完成、提醒与故障，并与灯光及界面状态同步。</p><section class="glass-panel p-8"><h2 class="text-xl font-bold mb-2">声音基调</h2><p class="text-sm text-gray-500 mb-6">避免尖锐蜂鸣与持续高响度，优先使用短促、柔和的合成音。</p><div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></section><div class="grid md:grid-cols-3 gap-5 mt-6"><article class="glass-panel p-6"><b>操作音</b><p class="text-sm text-gray-500 mt-3">40–120ms，确认轻量操作，不干扰连续任务。</p></article><article class="glass-panel p-6"><b>完成音</b><p class="text-sm text-gray-500 mt-3">上行双音，配合绿色完成灯光。</p></article><article class="glass-panel p-6"><b>警报音</b><p class="text-sm text-gray-500 mt-3">根据风险分级，并与橙色或红色灯光同步。</p></article></div></div><footer class="pt-10 pb-16 text-center text-gray-400 text-sm"><p class="font-light">&copy; 2026 Haier Design Lab. Internal Confidential.</p></footer></main></div><script src="haier-nav.js"></script></body></html>
